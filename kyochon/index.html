<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교촌치킨리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">  
    <script src="../npm/swiper/swiper-bundle.min.js"></script>  
</head>
<body>
    <div id="wrap">
        <header>제목공간</header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual01.png" alt="할인배너" class="pc">
                            <img src="img/m_visual01.png" alt="모바일할인배너" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual02.png" alt="달콤고구마" class="pc">
                            <img src="img/m_visual02.png" alt="모바일달콤고구마" class="mo">
                        </div>
                    </div>
                    <!-- Figma hero controls: progress / slide count / arrows -->
                    <div class="hero-controls">
                        <div class="swiper-scrollbar" aria-label="슬라이드 진행 상태"></div>
                        <div class="swiper-pagination" aria-label="현재 슬라이드"></div>
                        <div class="hero-navigation">
                            <button type="button" class="swiper-button-prev" aria-label="이전 슬라이드"></button>
                            <button type="button" class="swiper-button-next" aria-label="다음 슬라이드"></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiperHero = new Swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // Current slide / total slide, matching the Figma counter
            pagination: {
                el: '.visual .swiper-pagination',
                type: 'fraction',
                formatFractionCurrent: number => String(number).padStart(2, '0'),
                formatFractionTotal: number => String(number).padStart(2, '0'),
                renderFraction: (currentClass, totalClass) =>
                    '<span class="' + currentClass + '"></span>' +
                    '<span class="hero-pagination-divider" aria-hidden="true"></span>' +
                    '<span class="' + totalClass + '"></span>',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // Thin draggable progress track
            scrollbar: {
                el: '.visual .swiper-scrollbar',
                draggable: true,
                hide: false,
                snapOnRelease: true,
            },
        });
    </script>
</body>
</html>
